################ Application Configuration ################
spring.application.name=${APPLICATION_NAME:user-service}
server.port=${SERVER_PORT:9001}

################# MongoDB Configuration ##################
spring.data.mongodb.host=${MONGODB_HOST}
spring.data.mongodb.port=${MONGODB_PORT:27017}
spring.data.mongodb.username=${MONGODB_USERNAME}
spring.data.mongodb.password=${MONGODB_PASSWORD}
spring.data.mongodb.database=${MONGODB_DATABASE}
spring.data.mongodb.options=${MONGODB_OPTIONS:retryWrites=true&w=majority&appName=Cluster0&ssl=true}
spring.data.mongodb.uri=mongodb+srv://${spring.data.mongodb.username}:${spring.data.mongodb.password}@${spring.data.mongodb.host}/${spring.data.mongodb.database}?${spring.data.mongodb.options}

################# Commonlib Configuration ##################
commonlib.service.environment=${SERVICE_ENVIRONMENT:dev}
commonlib.service.name=${SERVICE_NAME:user-service}